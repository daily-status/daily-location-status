name: Build and Push Docker Images (TEST)

on:
  push:
    branches:
      - dev-oops
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: . # Standardized to Root
          file: ./backend/dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/daily-location-status-backend:test
            ${{ secrets.DOCKERHUB_USERNAME }}/daily-location-status-backend:test-${{ steps.vars.outputs.sha_short }}

      # Note: I'm adding build-args here so your frontend variables actually work.
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: . # Standardized to Root
          file: ./frontend/dockerfile
          push: true
          build-args: |
            FRONTEND_API_BASE_URL=${{ secrets.FRONTEND_API_BASE_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/daily-location-status-frontend:test
            ${{ secrets.DOCKERHUB_USERNAME }}/daily-location-status-frontend:test-${{ steps.vars.outputs.sha_short }}