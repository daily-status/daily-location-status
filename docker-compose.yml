services:
  db:
    image: mysql:8.1
    container_name: daily-status-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: daily_status
      MYSQL_PASSWORD: admin
    ports:
      - "3307:3306" # External access via 3307, internal via 3306
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - daily_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/dockerfile
      args:
        # Pass variables to the build stage for Prisma client generation
        DATABASE_URL: ${DATABASE_URL}
    container_name: daily-status-api
    restart: unless-stopped
    env_file: .env # Runtime variables
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - daily_network
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/data:/app/data
      - ./backups:/app/backups

  frontend:
    build:
      context: .
      dockerfile: frontend/dockerfile
      args:
        # Baked into the static JS files at build-time
        FRONTEND_API_BASE_URL: ${FRONTEND_API_BASE_URL}
        FRONTEND_DEV_SERVER_PORT: ${FRONTEND_DEV_SERVER_PORT}
        FRONTEND_DEV_PROXY_TARGET: ${FRONTEND_DEV_PROXY_TARGET}
    container_name: daily-status-ui
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - daily_network

networks:
  daily_network:
    driver: bridge

volumes:
  db_data: